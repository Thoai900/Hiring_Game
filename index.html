<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobNow Hiring Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f6f5f3;--ink:#1e1e1e;--grey:#6b6b6b;--line:#e5e3df;--acc:#e8833a;--accs:#fdf0e6;--bad:#c0392b;--onacc:#1a1a1a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--soft:#1e1e1e;--ink:#f2f0ed;--grey:#a3a09b;--line:#333;--acc:#f0955a;--accs:#2b1d12;--bad:#ef6b5b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--soft:#1e1e1e;--ink:#f2f0ed;--grey:#a3a09b;--line:#333;--acc:#f0955a;--accs:#2b1d12;--bad:#ef6b5b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:32px clamp(16px,5vw,80px) 48px}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand i{width:16px;height:16px;border-radius:50%;background:var(--acc)}
nav{display:flex;gap:24px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid var(--line);padding:6px 0;font:600 16px Inter,sans-serif;color:var(--grey);cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc)}
nav button:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{margin:36px 0 6px;font:600 14px Inter,sans-serif;letter-spacing:.1em;color:var(--acc)}
h1{margin:0;font-size:clamp(32px,5vw,44px);line-height:1.18;font-weight:700}
.sub{margin:8px 0 28px;color:var(--grey);font-size:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:28px}}
.card{background:var(--soft);border-radius:20px;padding:28px 32px}
.who{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:700;font-size:26px}
.who b{font-size:28px;display:block;line-height:1.2}.who span{font-size:16px;color:var(--grey)}
.lbl{font:600 16px Inter,sans-serif;color:var(--grey);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font:400 18px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:12px 18px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--acc)}
.chip.sel{background:var(--accs);border:2px solid var(--acc);padding:11px 17px;font-weight:600}
.chip .tx{display:inline;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 2px}
.chip:disabled{color:var(--ink)}
.chip.used .tx,.chip.irr .tx{background-size:100% 2px}
.chip.used:not(.done){opacity:.7}
.chip.done,.chip.irr{opacity:.5;cursor:default;transition:opacity .4s}
.chip.anim .tx{animation:strike .5s cubic-bezier(.3,.7,.2,1) backwards}
.chip.used.anim{animation:nudge .4s}
.bd{font-style:normal;font-size:13px;font-weight:600;margin-left:8px;color:var(--acc)}
@keyframes strike{from{background-size:0 2px}}
@keyframes nudge{40%{transform:scale(.95)}}
.slots{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:12px 20px;font:inherit;color:var(--ink);cursor:pointer}
.slot b{display:block;font-size:19px;font-weight:600}.slot small{font-size:15px;color:var(--grey)}
.slot .t{flex:1}
.slot .ic{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:16px}
.slot.ok{background:var(--accs);border:1.5px solid var(--acc)}.slot.ok small{color:var(--ink)}
.slot.ok .ic{background:var(--acc);color:var(--onacc)}
.slot.gap{cursor:default;opacity:.85}
.slot.bad{border-color:var(--bad);animation:sh .35s}
.slot.hint:not(.ok){border-style:solid;border-color:var(--acc)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{display:flex;align-items:center;gap:14px;min-height:84px;margin-top:20px;padding:16px 20px;border-radius:14px;color:var(--grey);font-size:16px;font-weight:600}
.msg strong{display:block;font-size:26px;line-height:1.2;font-weight:700;color:var(--ink)}
.msg span{display:block;font-size:16px;font-weight:500;color:var(--grey)}
.msg.good,.msg.done{background:var(--accs)}
.msg.good strong,.msg.done strong{color:var(--acc)}
.msg.done{border:2px solid var(--acc)}
.msg.bad{border:1.5px solid var(--bad);color:var(--bad)}
.msg.bad span{color:var(--bad);font-weight:600}
.ck{flex:none;width:36px;height:36px}
.msg.done .ck{width:44px;height:44px}
.msg.pop{animation:bpop .45s cubic-bezier(.2,1.3,.4,1)}
.msg.pop .ck circle{transform-box:fill-box;transform-origin:center;animation:cpop .4s cubic-bezier(.2,1.5,.4,1) backwards}
.msg.pop .ck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s .18s ease-out forwards}
.slot.new{animation:ring .7s ease-out}
.slot.new .ic{animation:cpop .4s cubic-bezier(.2,1.5,.4,1)}
.slot.gap.anim{animation:fadein .5s .4s backwards}
.btn.rdy{animation:glow 1.4s 1.2s ease-out 2}
@keyframes bpop{from{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes cpop{from{transform:scale(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{from{box-shadow:0 0 0 0 var(--acc)}to{box-shadow:0 0 0 16px transparent}}
@keyframes fadein{from{opacity:0}}
@keyframes glow{from{box-shadow:0 0 0 0 var(--acc)}to{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.msg.pop .ck path{stroke-dasharray:none;stroke-dashoffset:0}}
footer{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-top:28px}
footer span{color:var(--grey)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:600 18px Inter,sans-serif;border-radius:12px;padding:16px 28px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:12px 20px;text-align:center;border-bottom:1px solid var(--line)}
th{font:600 16px Inter,sans-serif;color:var(--grey);background:var(--soft)}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:400}
.win{background:var(--accs)}
th.win{color:var(--acc)}
tr.tot td{font-weight:700;font-size:22px;background:var(--soft);border-bottom:0}
tr.tot td.win{color:var(--acc);background:var(--accs)}
.tick{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:700;font-size:16px}
.dash{color:var(--grey);font-size:22px}
.why{margin-top:24px;padding:24px 28px;background:var(--accs);border-radius:20px;font-size:20px;line-height:1.55}
.why b{display:block;font:600 14px Inter,sans-serif;letter-spacing:.1em;color:var(--acc);margin-bottom:8px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><i></i>JobNow Hiring Game</div><nav id="nav" aria-label="Steps"></nav></header>
<main id="main"></main>
</div>
<script>
var REQ=["A degree in a related field","Good team player","Creative, with attention to detail","Confident, can-do attitude","Willingness to try new things","Writing experience"];
var C=[
{n:"Agata",sub:"Studying economics, London",chips:[["Studying economics",[0]],["Plays football with a local club",[1]],["Volunteers at a children’s hospital",[]],["Moved to London to study",[]],["Hopes to work in finance abroad",[]]],sal:"Low"},
{n:"Taro",sub:"English degree, Tokyo University",chips:[["English degree, Tokyo University",[0]],["Published travel writing",[2,5]],["Tried travel writing, not going home",[4]],["Travelled in Australia and New Zealand",[]],["Wants a permanent position",[]]],sal:"Mid"},
{n:"Maria",sub:"Medical studies, Guadalajara",chips:[["Medical studies",[0]],["Opened her own clinic",[3]],["Ready to change sector and train",[4]],["Hired two partners",[]],["Worked seven days a week",[]]],sal:"High"}];
var S={step:0,sel:null,pl:[{},{},{}],msg:"",det:"",cls:"",bad:-1,pop:false,nc:-1,ns:-1,fin:false};
function need(i){return C[i].chips.reduce(function(n,c){return n+c[1].length},0)}
function cnt(i){return Object.keys(S.pl[i]).length}
function done(i){return cnt(i)===need(i)}
function all(){return done(0)&&done(1)&&done(2)}
function chipDone(i,k){return C[i].chips[k][1].length>0&&C[i].chips[k][1].every(function(r){return S.pl[i][r]===k})}
function used(i,k){return C[i].chips[k][1].filter(function(r){return S.pl[i][r]===k}).length}
function nav(){
  var h="";
  C.forEach(function(c,i){h+='<button data-s="'+i+'" class="'+(S.step===i?"on":"")+'">'+(i+1)+"  "+c.n+"</button>"});
  h+='<button data-s="3" class="'+(S.step===3?"on":"")+'"'+(all()?"":" disabled")+">4  Summary</button>";
  document.getElementById("nav").innerHTML=h;
}
function ev(i){
  var c=C[i],fin=done(i),h="";
  h+='<p class="eyebrow">STEP '+(i+1)+' OF 4</p><h1>Find the evidence: '+c.n+'</h1><p class="sub">Tap a piece of evidence, then tap the requirement it matches.</p><div class="grid"><div class="card"><div class="who"><div class="av">'+c.n[0]+'</div><div><b>'+c.n+'</b><span>'+c.sub+'</span></div></div><p class="lbl">Evidence</p><div class="chips">';
  var irrN=0;
  c.chips.forEach(function(x,k){var u=used(i,k),d=chipDone(i,k),ir=fin&&x[1].length===0;var cl="chip"+(S.sel===k?" sel":"")+(u?" used":"")+(d?" done":"")+(ir?" irr":"")+((S.nc===k||(S.fin&&ir))?" anim":"");var dl=ir?(irrN++)*0.14+0.5:0;h+='<button class="'+cl+'" data-c="'+k+'"'+(d||ir?" disabled":"")+'><span class="tx" style="animation-delay:'+dl+'s">'+x[0]+"</span>"+(x[1].length>1&&u&&!d?'<em class="bd">'+u+"/"+x[1].length+"</em>":"")+"</button>"});
  var ck='<svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--acc)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="var(--onacc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>';
  var bp=S.pop?" pop":"",bn;
  if(fin)bn='<div class="msg done'+bp+'" role="status" aria-live="polite">'+ck+'<div><strong>Completed!</strong><span>All evidence for '+c.n+' is matched. Unrelated items are crossed out.</span></div></div>';
  else if(S.cls==="good")bn='<div class="msg good'+bp+'" role="status" aria-live="polite">'+ck+'<div><strong>Match!</strong><span>'+S.det+'</span></div></div>';
  else bn='<div class="msg '+S.cls+bp+'" role="status" aria-live="polite"><div><span>'+(S.msg||"Tap a piece of evidence to begin.")+'</span></div></div>';
  h+='</div>'+bn+'</div><div><p class="lbl">Job requirements: Medical Insurance Product Writer</p><div class="slots">';
  REQ.forEach(function(r,k){
    var k2=S.pl[i][k],ok=k2!==undefined,hasMatch=c.chips.some(function(x){return x[1].indexOf(k)>-1});
    var gap=fin&&!ok;
    h+='<button class="slot'+(ok?" ok":"")+(gap?" gap"+(S.fin?" anim":""):"")+(S.ns===k?" new":"")+(S.bad===k?" bad":"")+(S.sel!==null&&!ok?" hint":"")+'" data-r="'+k+'"><span class="t"><b>'+r+"</b><small>"+(ok?c.chips[k2][0]:gap?"Gap: no evidence":"Drop evidence here")+'</small></span><span class="ic">'+(ok?"✓":"–")+"</span></button>";
  });
  h+='</div></div></div><footer><span>'+cnt(i)+" of "+need(i)+" matched"+(fin?" · the empty slots are gaps":"")+'</span><div class="btns">'+(i>0?'<button class="btn" data-go="'+(i-1)+'">Back</button>':"")+'<button class="btn pri'+(fin&&S.fin?" rdy":"")+'" data-go="'+(i+1)+'"'+(fin?"":" disabled")+">"+(i<2?"Next: "+C[i+1].n:"See summary")+"</button></div></footer>";
  return h;
}
function best(){var b=0;[0,1,2].forEach(function(i){if(cnt(i)>cnt(b))b=i});return b}
var TXT="";
function summ(){
  var w=best(),h='<p class="eyebrow">STEP 4 OF 4</p><h1>Best match: '+C[w].n+'</h1><p class="sub">'+C[w].n+" matches "+cnt(w)+" of "+REQ.length+" requirements, including writing, the core of the job.</p>";
  h+='<div class="tw"><table><thead><tr><th>Requirement</th>';
  C.forEach(function(c,i){h+='<th class="'+(i===w?"win":"")+'">'+c.n+"</th>"});
  h+="</tr></thead><tbody>";
  REQ.forEach(function(r,k){h+="<tr><td>"+r+"</td>";C.forEach(function(c,i){h+='<td class="'+(i===w?"win":"")+'">'+(S.pl[i][k]!==undefined?'<span class="tick" aria-label="Yes">✓</span>':'<span class="dash" aria-label="No">–</span>')+"</td>"});h+="</tr>"});
  h+="<tr><td>Likely salary</td>";C.forEach(function(c,i){h+='<td class="'+(i===w?"win":"")+'">'+c.sal+"</td>"});h+="</tr>";
  h+='<tr class="tot"><td>Score</td>';C.forEach(function(c,i){h+='<td class="'+(i===w?"win":"")+'">'+cnt(i)+" / "+REQ.length+"</td>"});h+="</tr></tbody></table></div>";
  TXT="We chose Taro. He has an English degree and published writing, which fits a job about writing marketing materials. Maria has more experience but no writing background. Agata costs less but has no professional experience.";
  h+='<div class="why"><b>EXPLAIN YOUR CHOICE</b><span id="why">'+TXT+'</span></div><footer><span id="cp"></span><div class="btns"><button class="btn" data-go="reset">Play again</button><button class="btn pri" data-go="copy">Copy explanation</button></div></footer>';
  return h;
}
function render(){nav();document.getElementById("main").innerHTML=S.step===3?summ():ev(S.step);S.pop=false;S.nc=-1;S.ns=-1;S.fin=false}
function go(n){S.step=n;S.sel=null;S.msg="";S.cls="";S.bad=-1;render();window.scrollTo(0,0)}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var i=S.step;
  if(b.dataset.s!==undefined){go(+b.dataset.s)}
  else if(b.dataset.c!==undefined&&i<3){var k=+b.dataset.c;S.sel=S.sel===k?null:k;S.msg=S.sel===null?"":"Now tap the requirement it matches.";S.cls="";render()}
  else if(b.dataset.r!==undefined&&i<3){
    var r=+b.dataset.r;
    if(S.pl[i][r]!==undefined){delete S.pl[i][r];S.msg="Removed. Try again.";S.cls="";render();return}
    if(done(i))return;
    if(S.sel===null){S.msg="Pick a piece of evidence first.";S.cls="bad";render();return}
    if(C[i].chips[S.sel][1].indexOf(r)>-1){var k0=S.sel;S.pl[i][r]=k0;S.nc=k0;S.ns=r;S.det=C[i].chips[k0][0]+" → "+REQ[r];S.sel=null;S.msg="Match!";S.cls="good";S.bad=-1;S.pop=true;S.fin=done(i);render()}
    else{S.msg="Not a match for that requirement. Try again.";S.cls="bad";S.bad=r;S.pop=true;render();setTimeout(function(){S.bad=-1},400)}
  }
  else if(b.dataset.go==="reset"){S.pl=[{},{},{}];go(0)}
  else if(b.dataset.go==="copy"){
    var cp=document.getElementById("cp");
    try{navigator.clipboard.writeText(TXT).then(function(){cp.textContent="Copied."},function(){cp.textContent="Select the text above to copy."})}catch(x){cp.textContent="Select the text above to copy."}
  }
  else if(b.dataset.go!==undefined){go(+b.dataset.go)}
});
render();
</script>
</body>
</html>
