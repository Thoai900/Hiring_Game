<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobNow Hiring Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--soft:#f3f1ec;--ink:#1e1e1e;--grey:#6b6b6b;--line:#e5e3df;--acc:#e8833a;--accs:#fdf0e6;--bad:#c0392b;--onacc:#1a1a1a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#fbfaf7;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:32px clamp(16px,5vw,80px) 48px}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand i{width:16px;height:16px;border-radius:50%;background:var(--acc)}
nav{display:flex;gap:24px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid var(--line);padding:6px 0;font:600 16px Inter,sans-serif;color:var(--grey);cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc)}
nav button:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{margin:36px 0 6px;font:600 14px Inter,sans-serif;letter-spacing:.1em;color:var(--acc)}
h1{margin:0;font-size:clamp(32px,5vw,44px);line-height:1.18;font-weight:700}
.sub{margin:8px 0 28px;color:var(--grey);font-size:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:28px}}
.card{background:var(--soft);border-radius:20px;padding:28px 32px}
.who{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:700;font-size:26px}
.who b{font-size:28px;display:block;line-height:1.2}.who span{font-size:16px;color:var(--grey)}
.lbl{font:600 16px Inter,sans-serif;color:var(--grey);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font:400 18px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:12px 18px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--acc)}
.chip.sel{background:var(--accs);border:2px solid var(--acc);padding:11px 17px;font-weight:600}
.chip .tx{display:inline;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 2px}
.chip:disabled{color:var(--ink)}
.chip.used .tx,.chip.irr .tx{background-size:100% 2px}
.chip.used:not(.done){opacity:.7}
.chip.done,.chip.irr{opacity:.5;cursor:default;transition:opacity .4s}
.chip.anim .tx{animation:strike .5s cubic-bezier(.3,.7,.2,1) backwards}
.chip.used.anim{animation:nudge .4s}
.bd{font-style:normal;font-size:13px;font-weight:600;margin-left:8px;color:var(--acc)}
@keyframes strike{from{background-size:0 2px}}
@keyframes nudge{40%{transform:scale(.95)}}
.slots{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:12px 20px;font:inherit;color:var(--ink);cursor:pointer}
.slot b{display:block;font-size:19px;font-weight:600}.slot small{font-size:15px;color:var(--grey)}
.slot .t{flex:1}
.slot .ic{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:16px}
.slot.ok{background:var(--accs);border:1.5px solid var(--acc)}.slot.ok small{color:var(--ink)}
.slot.ok .ic{background:var(--acc);color:var(--onacc)}
.slot.gap{cursor:default;opacity:.85}
.slot.bad{border-color:var(--bad);animation:sh .35s}
.slot.hint:not(.ok){border-style:solid;border-color:var(--acc)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{display:flex;align-items:center;gap:14px;min-height:84px;margin-top:20px;padding:16px 20px;border-radius:14px;color:var(--grey);font-size:16px;font-weight:600}
.msg strong{display:block;font-size:26px;line-height:1.2;font-weight:700;color:var(--ink)}
.msg span{display:block;font-size:16px;font-weight:500;color:var(--grey)}
.msg.good,.msg.done{background:var(--accs)}
.msg.good strong,.msg.done strong{color:var(--acc)}
.msg.done{border:2px solid var(--acc)}
.msg.bad{border:1.5px solid var(--bad);color:var(--bad)}
.msg.bad span{color:var(--bad);font-weight:600}
.ck{flex:none;width:36px;height:36px}
.msg.done .ck{width:44px;height:44px}
.msg.pop{animation:bpop .45s cubic-bezier(.2,1.3,.4,1)}
.msg.pop .ck circle{transform-box:fill-box;transform-origin:center;animation:cpop .4s cubic-bezier(.2,1.5,.4,1) backwards}
.msg.pop .ck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s .18s ease-out forwards}
.slot.new{animation:ring .7s ease-out}
.slot.new .ic{animation:cpop .4s cubic-bezier(.2,1.5,.4,1)}
.slot.gap.anim{animation:fadein .5s .4s backwards}
.btn.rdy{animation:glow 1.4s 1.2s ease-out 2}
@keyframes bpop{from{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes cpop{from{transform:scale(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{from{box-shadow:0 0 0 0 var(--acc)}to{box-shadow:0 0 0 16px transparent}}
@keyframes fadein{from{opacity:0}}
@keyframes glow{from{box-shadow:0 0 0 0 var(--acc)}to{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.msg.pop .ck path{stroke-dasharray:none;stroke-dashoffset:0}}
footer{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-top:28px}
footer span{color:var(--grey)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:600 18px Inter,sans-serif;border-radius:12px;padding:16px 28px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:12px 20px;text-align:center;border-bottom:1px solid var(--line)}
th{font:600 16px Inter,sans-serif;color:var(--grey);background:var(--soft)}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:400}
.win{background:var(--accs)}
th.win{color:var(--acc)}
tr.tot td{font-weight:700;font-size:22px;background:var(--soft);border-bottom:0}
tr.tot td.win{color:var(--acc);background:var(--accs)}
.tick{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:700;font-size:16px}
.dash{color:var(--grey);font-size:22px}
.why{margin-top:24px;padding:24px 28px;background:var(--accs);border-radius:20px;font-size:20px;line-height:1.55}
.why b{display:block;font:600 14px Inter,sans-serif;letter-spacing:.1em;color:var(--acc);margin-bottom:8px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.stage{position:relative;height:clamp(560px,82vh,700px);margin-top:8px;overflow:hidden;border-radius:24px}
.pf{position:absolute;left:50%;top:50%;width:176px;margin:-58px 0 0 -88px;padding:12px;display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(30,30,30,.08);pointer-events:none;will-change:transform,opacity}
.pf .pa{width:44px;height:44px;border-radius:50%;overflow:hidden;display:block}
.pf .pa svg{width:100%;height:100%;display:block}
.pf b{display:block;font-size:15px;line-height:1.2}
.pf small{display:block;font-size:13px;color:var(--grey);line-height:1.3}
.pf .tg{grid-column:1/-1;display:flex;gap:6px;margin-top:4px}
.pf .tg i{font:600 12px Inter,sans-serif;font-style:normal;color:var(--acc);background:var(--accs);border-radius:999px;padding:3px 9px}
@media (max-width:700px){.pf{width:132px;margin:-48px 0 0 -66px;padding:9px;grid-template-columns:34px 1fr}.pf .pa{width:34px;height:34px}.pf b{font-size:13px}.pf small{font-size:11px}.pf .tg i{font-size:10px;padding:2px 7px}}
.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,92%);text-align:center;z-index:5;transition:opacity .5s,transform .5s}
.hero.out{opacity:0;transform:translate(-50%,-54%) scale(.96);pointer-events:none}
.hero h1{font-size:clamp(40px,7vw,64px);line-height:1.1}
.hero .sub{margin:14px 0 28px}
.hero .eyebrow{margin:0 0 14px}
.hero .btn{font-size:22px;padding:20px 56px;box-shadow:0 10px 28px rgba(232,131,58,.28)}
.hero .hint{margin:16px 0 0;font-size:16px;color:var(--grey)}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:5;opacity:0;transition:opacity .5s .2s;pointer-events:none}
.status.on{opacity:1}
.status b{display:block;font-size:30px}
.status span{color:var(--grey);font-size:18px}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:8px}
@media (max-width:820px){.cgrid{grid-template-columns:1fr;gap:16px}}
.cc{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;box-shadow:0 8px 24px rgba(30,30,30,.05);transition:transform .25s,border-color .25s,background .25s,box-shadow .25s}
.cc:hover,.cc:focus-visible{transform:translateY(-6px);border-color:var(--acc);background:var(--accs);box-shadow:0 16px 36px rgba(232,131,58,.16)}
.cc img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--bg);box-shadow:0 0 0 2px var(--line);transition:box-shadow .25s}
.cc:hover img{box-shadow:0 0 0 3px var(--acc)}
.cc b{font-size:32px;line-height:1.1}
.cc .cs{font-size:18px;color:var(--grey);text-align:center}
.cc .tg2{display:flex;gap:8px}
.cc .tg2 i{font:600 16px Inter,sans-serif;font-style:normal;color:var(--acc);background:var(--accs);border-radius:999px;padding:6px 14px}
.cc:hover .tg2 i{background:var(--bg)}
.cc .go{align-self:stretch;font:600 18px Inter,sans-serif;font-style:normal;text-align:center;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);transition:background .25s,border-color .25s}
.cc:hover .go{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.emerge .cc{animation:emerge .7s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes emerge{from{opacity:0;transform:scale(.3)}}
.center{text-align:center}
img.av{display:block;object-fit:cover;background:var(--soft)}
</style>
</head>

<div class="wrap">
<header><div class="brand"><i></i>JobNow Hiring Game</div><nav id="nav" aria-label="Steps"></nav></header>
<main id="main"></main>
</div>

    h+='<button class="slot'+(ok?" ok":"")+(gap?" gap"+(S.fin?" anim":""):"")+(S.ns===k?" new":"")+(S.bad===k?" bad":"")+(S.sel!==null&&!ok?" hint":"")+'" data-r="'+k+'"><span class="t"><b>'+r+"</b><small>"+(ok?c.chips[k2][0]:gap?"Gap: no evidence":"Drop evidence here")+'</small></span><span class="ic">'+(ok?"✓":"–")+"</span></button>";
  });
  h+='</div></div></div><footer><span>'+cnt(i)+" of "+need(i)+" matched"+(fin?" · the empty slots are gaps":"")+'</span><div class="btns">'+'<button class="btn" data-go="choose">Choose candidate</button>'+'<button class="btn pri'+(fin&&S.fin?" rdy":"")+'" data-go="'+nextOf(i)+'"'+(fin?"":" disabled")+">"+(nextOf(i)<3?"Next: "+C[nextOf(i)].n:"See summary")+"</button></div></footer>";
  return h;
}
function best(){var b=0;[0,1,2].forEach(function(i){if(cnt(i)>cnt(b))b=i});return b}
var TXT="";
function summ(){
  var w=best(),h='<p class="eyebrow">STEP 4 OF 4</p><h1>Best match: '+C[w].n+'</h1><p class="sub">'+C[w].n+" matches "+cnt(w)+" of "+REQ.length+" requirements, including writing, the core of the job.</p>";
  h+='<div class="tw"><table><thead><tr><th>Requirement</th>';
  C.forEach(function(c,i){h+='<th class="'+(i===w?"win":"")+'">'+c.n+"</th>"});
  h+="</tr></thead><tbody>";
  REQ.forEach(function(r,k){h+="<tr><td>"+r+"</td>";C.forEach(function(c,i){h+='<td class="'+(i===w?"win":"")+'">'+(S.pl[i][k]!==undefined?'<span class="tick" aria-label="Yes">✓</span>':'<span class="dash" aria-label="No">–</span>')+"</td>"});h+="</tr>"});
  h+="<tr><td>Likely salary</td>";C.forEach(function(c,i){h+='<td class="'+(i===w?"win":"")+'">'+c.sal+"</td>"});h+="</tr>";
  h+='<tr class="tot"><td>Score</td>';C.forEach(function(c,i){h+='<td class="'+(i===w?"win":"")+'">'+cnt(i)+" / "+REQ.length+"</td>"});h+="</tr></tbody></table></div>";
  TXT="We chose Taro. He has an English degree and published writing, which fits a job about writing marketing materials. Maria has more experience but no writing background. Agata costs less but has no professional experience.";
  h+='<div class="why"><b>EXPLAIN YOUR CHOICE</b><span id="why">'+TXT+'</span></div><footer><span id="cp"></span><div class="btns"><button class="btn" data-go="reset">Play again</button><button class="btn pri" data-go="copy">Copy explanation</button></div></footer>';
  return h;
}

function nextOf(i){for(var d=1;d<3;d++){var j=(i+d)%3;if(!done(j))return j}return 3}
var TG=[["Economics","Football"],["English","Writing"],["Medicine","Clinic"]];
var FN=["Linh","Marcus","Sofia","Kenji","Amira","Diego","Hana","Lucas","Priya","Noah","Elena","Omar","Mai","Jonas","Chloe","Ivan","Yuki","Zara"];
var LN=["Nguyen","Silva","Tanaka","Costa","Weber","Khan","Moreau","Rossi","Park","Novak","Lopez","Berg"];
var JOBS=["Graphic designer","Data analyst","Nurse","Chef","Sales manager","Teacher","Accountant","Photographer","Engineer","Journalist","Architect","Pharmacist"];
var SK=["Design","Excel","Teamwork","Sales","Travel","Cooking","Writing","Sports","Finance","Marketing","Health","Music"];
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function face(){
  var sk=rnd(["#F3CBA8","#E3AB80","#C98B5F","#9A6340","#F8DEC6"]),hr=rnd(["#2B2118","#5A3A22","#B8863B","#1E1E1E","#8C8C8C","#A5532F"]),bg=rnd(["#DDEBE3","#D8E4F3","#F0DDCF","#EADDF0","#F6EBC8","#DCE9EC"]),sh=rnd(["#E8833A","#4A6FA5","#5B8C6A","#B25E8B","#444B57","#C9A227"]),st=Math.floor(Math.random()*3);
  var top='<path d="M20 28c0-11 5-16 12-16s12 5 12 16c-3-5-7-7-12-7s-9 2-12 7z" fill="'+hr+'"/>';
  var g='<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="'+bg+'"/>';
  if(st===1)g+='<path d="M16 50V28c0-12 7-18 16-18s16 6 16 18v22z" fill="'+hr+'"/>';
  g+='<path d="M10 64c0-12 9-17 22-17s22 5 22 17z" fill="'+sh+'"/><rect x="28" y="38" width="8" height="10" fill="'+sk+'"/><ellipse cx="32" cy="29" rx="11" ry="13" fill="'+sk+'"/>';
  g+=(st===2?'<circle cx="32" cy="10" r="6" fill="'+hr+'"/>':"")+top;
  g+='<circle cx="27.5" cy="30" r="1.3" fill="#1e1e1e"/><circle cx="36.5" cy="30" r="1.3" fill="#1e1e1e"/><path d="M28 35c2.5 2.5 5.5 2.5 8 0" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round"/>';
  if(Math.random()<.3)g+='<circle cx="27.5" cy="30" r="4" fill="none" stroke="#1e1e1e" stroke-width="1.1"/><circle cx="36.5" cy="30" r="4" fill="none" stroke="#1e1e1e" stroke-width="1.1"/>';
  return g+"</svg>";
}
var RAF=0,SW=null,P=[];
function stopAnim(){if(RAF)cancelAnimationFrame(RAF);RAF=0;SW=null}
function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2}
function intro(){
  var m=document.getElementById("main"),h="";
  if(S.ph==="choose"){
    h='<div class="'+(S.emerge?"emerge":"")+'"><p class="eyebrow center">CHOOSE A CANDIDATE</p><h1 class="center">Who do you want to start with?</h1><p class="sub center">Pick any candidate. You will review all three.</p><div class="cgrid">';
    C.forEach(function(c,i){h+='<button class="cc" data-pick="'+i+'" style="animation-delay:'+(i*.12)+'s"><img src="'+c.img+'" alt="'+c.n+'"><b>'+c.n+'</b><span class="cs">'+c.sub+'</span><span class="tg2"><i>'+TG[i][0]+'</i><i>'+TG[i][1]+'</i></span><em class="go">'+(done(i)?"Review again":"Start with "+c.n)+"</em></button>"});
    m.innerHTML=h+"</div></div>";S.emerge=false;return;
  }
  var N=window.innerWidth<700?8:12,cards="",off=Math.random()*6.28;P=[];
  for(var i=0;i<N;i++){
    P.push({a:off+i/N*6.2832+(Math.random()-.5)*.3,r:.84+Math.random()*.16,rot:(Math.random()-.5)*16,ph:Math.random()*6.28,sp:.0008+Math.random()*.0007,sc:.88+Math.random()*.22,op:.6+Math.random()*.4});
    cards+='<div class="pf"><span class="pa">'+face()+'</span><div><b>'+rnd(FN)+" "+rnd(LN)+"</b><small>"+rnd(JOBS)+'</small></div><div class="tg"><i>'+rnd(SK)+"</i><i>"+rnd(SK)+"</i></div></div>";
  }
  m.innerHTML='<div class="stage" id="stage">'+cards+'<div class="hero" id="hero"><p class="eyebrow">ONLINE PROFILES</p><h1>Who fits the job?</h1><p class="sub">Three candidates. One job: Medical Insurance Product Writer.</p><button class="btn pri" data-go="start">Start</button><p class="hint">3 candidates · pick the best match</p></div><div class="status" id="status" role="status"><b>Matching candidates…</b><span>Shuffling online profiles</span></div></div>';
  var els=m.querySelectorAll(".pf");P.forEach(function(o,k){o.el=els[k]});
  RAF=requestAnimationFrame(frame);
}
function frame(now){
  var st=document.getElementById("stage");if(!st){RAF=0;return}
  var w=st.clientWidth,hh=st.clientHeight,cw=w<700?132:176,ch=w<700?96:118;
  var rx=w/2-cw/2-6,ry=hh/2-ch/2-6,sq=ry/rx,Ro=rx*.5,t=SW?now-SW:-1;
  P.forEach(function(o){
    var r=o.r*rx,a=o.a,rot=o.rot,sc=o.sc,op=o.op,fl=1;
    if(t>=0){
      var p=Math.min(t/3400,1),e1=ease(Math.min(t/800,1));
      a=o.a+6*Math.PI*p*p;r=r+(Ro-r)*e1;fl=1-e1;rot=o.rot+(a-o.a)*11.5;
      if(t>2600){var e3=ease(Math.min((t-2600)/800,1));r*=1-e3;sc*=1-.75*e3;op*=1-e3}
    }
    var x=r*Math.cos(a)+Math.sin(now*o.sp+o.ph)*10*fl,y=r*sq*Math.sin(a)+Math.cos(now*o.sp*.8+o.ph)*12*fl;
    o.el.style.transform="translate("+x+"px,"+y+"px) rotate("+rot+"deg) scale("+sc+")";o.el.style.opacity=op;
  });
  if(t>=3400){S.ph="choose";S.emerge=true;render();return}
  RAF=requestAnimationFrame(frame);
}
function startSwirl(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){S.ph="choose";render();return}
  if(SW)return;SW=performance.now();
  document.getElementById("hero").classList.add("out");document.getElementById("status").classList.add("on");
}
function render(){stopAnim();nav();if(S.step===-1){intro();return}document.getElementById("main").innerHTML=S.step===3?summ():ev(S.step);S.pop=false;S.nc=-1;S.ns=-1;S.fin=false}
function go(n){S.step=n;S.sel=null;S.msg="";S.cls="";S.bad=-1;render();window.scrollTo(0,0)}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var i=S.step;if(b.dataset.go==="start"){startSwirl();return}if(b.dataset.pick!==undefined){go(+b.dataset.pick);return}
  if(b.dataset.s!==undefined){go(+b.dataset.s)}
  else if(b.dataset.c!==undefined&&i<3){var k=+b.dataset.c;S.sel=S.sel===k?null:k;S.msg=S.sel===null?"":"Now tap the requirement it matches.";S.cls="";render()}
  else if(b.dataset.r!==undefined&&i<3){
    var r=+b.dataset.r;
    if(S.pl[i][r]!==undefined){delete S.pl[i][r];S.msg="Removed. Try again.";S.cls="";render();return}
    if(done(i))return;
    if(S.sel===null){S.msg="Pick a piece of evidence first.";S.cls="bad";render();return}
    if(C[i].chips[S.sel][1].indexOf(r)>-1){var k0=S.sel;S.pl[i][r]=k0;S.nc=k0;S.ns=r;S.det=C[i].chips[k0][0]+" → "+REQ[r];S.sel=null;S.msg="Match!";S.cls="good";S.bad=-1;S.pop=true;S.fin=done(i);render()}
    else{S.msg="Not a match for that requirement. Try again.";S.cls="bad";S.bad=r;S.pop=true;render();setTimeout(function(){S.bad=-1},400)}
  }
  else if(b.dataset.go==="reset"){S.pl=[{},{},{}];S.ph="splash";go(-1)}
  else if(b.dataset.go==="choose"){S.ph="choose";go(-1)}
  else if(b.dataset.go==="copy"){
    var cp=document.getElementById("cp");
    try{navigator.clipboard.writeText(TXT).then(function(){cp.textContent="Copied."},function(){cp.textContent="Select the text above to copy."})}catch(x){cp.textContent="Select the text above to copy."}
  }
  else if(b.dataset.go!==undefined){go(+b.dataset.go)}
});
render();
</script>
